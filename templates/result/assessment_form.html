{% extends "base.html" %}

{% block title %}Update CGPA{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Update Student CGPA</h2>

    <form method="post">

        {% csrf_token %}

        {% for field in form %}

            <div class="form-group">

                {{ field.label_tag }}
                {{ field }}

                {% for error in field.errors %}
                    <small class="text-danger">
                        {{ error }}
                    </small>
                {% endfor %}

            </div>

        {% endfor %}

        <button class="btn btn-primary">
            Calculate CGPA
        </button>

    </form>

</div>

{% endblock %}
