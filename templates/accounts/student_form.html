{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="form-container">

    <h2 class="mb-4">{{ title }}</h2>

    <form method="post">

        {% csrf_token %}

        {% for field in form %}

            <div class="form-group">

                {{ field.label_tag }}

                {{ field }}

                {% for error in field.errors %}
                    <small class="text-danger d-block">
                        {{ error }}
                    </small>
                {% endfor %}

            </div>

        {% endfor %}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Student
        </button>

        <a
            href="{% url 'accounts:student_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
